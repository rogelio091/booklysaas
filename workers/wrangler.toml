name = "bookly-api-local"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (configure via `wrangler secret put`, never committed to config):
#   ENCRYPTION_KEY — 256-bit master key for tenant credential encryption at rest
#                    (AES-GCM via HKDF, see src/utils/crypto.ts).

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "bookly-db-local"
database_id = "local-d1-id"
migrations_dir = "src/db/migrations"

[triggers]
crons = ["0 * * * *"]
